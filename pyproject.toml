[project]
name = "ssgrl"
version = "0.2.0"
description = "Self-supervised (SimSiam) representation learning for short DNA reads"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.16",
    "keras>=3.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "editdistance>=0.6",
    "mappy>=2.24",
]

[project.optional-dependencies]
dev = ["pytest"]
mlflow = ["mlflow"]

[tool.setuptools]
packages = ["ssgrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:`shuffle=True` was passed:UserWarning",
]
